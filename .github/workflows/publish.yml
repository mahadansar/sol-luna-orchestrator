name: Publish

# Publishes to npm using npm Trusted Publishing (OIDC). There is no npm token
# anywhere in this workflow, no repository secret, and nothing to rotate or leak:
# npm exchanges GitHub's short-lived OIDC token for publish rights, which is why
# `id-token: write` is the one unusual permission below.
#
# Because this repository and the package are both public, npm attaches
# provenance automatically for trusted publishing — `--provenance` is not passed
# and is not needed.

on:
  push:
    # Release tags only. Never branches, never pull requests, so a merge can
    # never publish. Pre-release tags (v1.0.0-rc.1) deliberately do not match;
    # publishing one is a manual decision, not an accident.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# One publish at a time per tag. Never cancel in progress: interrupting a publish
# mid-flight is worse than making the second run wait.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to immutable commits. Update these SHAs only
      # in a reviewed dependency-maintenance change after verifying the upstream tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit is validated on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGGED_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TAGGED_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Tagged commit $TAGGED_SHA is not the current origin/main commit $MAIN_SHA. Nothing was published."
            exit 1
          fi

          CI_RUN_ID="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=$TAGGED_SHA" \
            -f "event=workflow_dispatch" \
            -f "status=success" \
            -f "per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::Tagged commit $TAGGED_SHA has no successful manually dispatched CI run. Nothing was published."
            exit 1
          fi
          echo "validated CI run: $CI_RUN_ID"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Active LTS for releases. Node 24 ships npm 11.17+, comfortably above
          # the 11.5.1 that trusted publishing requires.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No cache in a release build: the artifact that reaches npm should be
          # built from the published shrinkwrap, not from whatever a cache happened to hold.
          package-manager-cache: false

      # The tag is the only thing a human types during a release, so it is the
      # thing most likely to be wrong. Refuse before anything is built or
      # published rather than shipping a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          SHRINKWRAP_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('npm-shrinkwrap.json','utf8')).version")"
          SHRINKWRAP_ROOT_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('npm-shrinkwrap.json','utf8')).packages[''].version")"
          echo "tag:        $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          echo "npm-shrinkwrap.json: $SHRINKWRAP_VERSION / root $SHRINKWRAP_ROOT_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$SHRINKWRAP_VERSION" ] || [ "$TAG_VERSION" != "$SHRINKWRAP_ROOT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package/shrinkwrap versions. Nothing was published."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: MCP protocol smoke test
        run: node dist/smoke-protocol.js

      - name: Pack the validated release
        run: npm pack

      - name: Preserve validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: sol-luna-orchestrator-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: npm publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      # Keep the credential-bearing job minimal: it receives only the tarball
      # produced by the validated job and never checks out or builds repository code.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: package

      - name: Publish validated package to npm
        run: npm publish package/sol-luna-orchestrator-*.tgz
