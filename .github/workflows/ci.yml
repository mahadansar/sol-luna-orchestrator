name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No API keys, no model calls, no network access to OpenAI. Everything here is
# deterministic. Tests that need a real Codex login live in the `smoke:live`,
# `smoke:parallel` and `bench` scripts and are deliberately not run here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24 is the active LTS line, 26 is Current. Node 20 reached end of life
        # in 2026 and is no longer tested or supported.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24", "26"]

    steps:
      - uses: actions/checkout@v7

      # v7 of both actions runs on the node24 runner. Earlier majors ran on
      # node20, which GitHub now reports as deprecated on every job.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The worktree tests drive the real git CLI. Give it an identity so
      # committing fixtures works on a bare runner.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # Unit, security/path-escape, parallel orchestration and CLI/config tests.
      # The parallel suite creates real git worktrees and real temp directories,
      # and the CLI suite spawns the real binary, so both exercise this runner's
      # actual filesystem and process semantics — path separators, case
      # sensitivity, symlink support and file locking.
      - name: Tests
        run: node --test dist/selftest.js dist/security.test.js dist/parallel.test.js dist/cli.test.js dist/bench.test.js

      # Starts the MCP server as a subprocess and performs a real protocol
      # handshake. Needs no model access.
      - name: MCP protocol smoke test
        run: node dist/smoke-protocol.js

      # Proves each benchmark fixture fails in its starting state and passes
      # with its committed reference solution.
      - name: Benchmark fixture validation
        run: node dist/bench/validate.js

      # Catches an accidental change to `files` or `bin` before it reaches npm.
      - name: Packaging check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm pack --dry-run

      - name: Report symlink capability
        if: always()
        shell: bash
        run: |
          echo "Platform: $RUNNER_OS"
          node -e "const fs=require('fs'),os=require('os'),p=require('path');
          const d=fs.mkdtempSync(p.join(os.tmpdir(),'lnk-'));
          try{fs.symlinkSync(d,p.join(d,'l'),process.platform==='win32'?'junction':'dir');
          console.log('directory links: supported');}
          catch(e){console.log('directory links: NOT supported ->',e.code);}"
