# Example Codex configuration for sol-luna-orchestrator.
#
# Merge this into ~/.codex/config.toml (or %USERPROFILE%\.codex\config.toml).
# Replace /absolute/path/to with wherever you cloned this repository.

# The supervisor. Sol at high effort is the recommended default: it decides what
# to delegate and reviews what comes back.
#
# Supported efforts for gpt-5.6-sol: low, medium, high, xhigh, max, ultra.
#   medium  simple but non-trivial work with obvious decomposition
#   high    DEFAULT - architecture, decomposition, delegation, review
#   xhigh   difficult architecture, subtle bugs, hard decomposition
#   max     exceptional supervisor-level problems only
# `low` is too shallow to decompose or review well; `ultra` is not warranted by
# anything this tool does.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[mcp_servers.sol-luna-orchestrator]
command = "node"
args = ["/absolute/path/to/sol-luna-orchestrator/dist/server.js"]

# REQUIRED. Codex defaults to a 60 second tool timeout; a delegated task runs for
# minutes, so without this every delegation is aborted mid-flight.
tool_timeout_sec = 3600

# REQUIRED. Must be "approve", which permits the tool without prompting.
# "auto" does NOT work here: non-interactive runs cancel the call outright.
default_tools_approval_mode = "approve"

# Optional. The server starts in well under a second; this is just headroom.
startup_timeout_sec = 30

[mcp_servers.sol-luna-orchestrator.env]
# Optional but strongly recommended: the single best troubleshooting signal.
# No file at all  => Codex never started the server (config or path problem).
# "client connected" but no "delegate_task" line => the model never called it.
SOL_LUNA_LOG = "/absolute/path/to/sol-luna-orchestrator/orchestrator.log"

# Optional: one JSON record per delegation (effort, verdict, duration, tokens).
# SOL_LUNA_EVENTS = "/absolute/path/to/sol-luna-orchestrator/delegations.jsonl"

# --- Optional hardening ----------------------------------------------------
# Confine delegation to specific directory trees (OS path separator delimited).
# SOL_LUNA_ALLOWED_ROOTS = "/home/you/projects"

# Verification execution policy. Default "allowlist" parses commands into argv
# with no shell and only launches known build/test tools.
#   off   - never execute model-chosen commands
#   shell - hand the raw string to a system shell (unsafe; see SECURITY.md)
# SOL_LUNA_VERIFY_MODE = "allowlist"

# Extra executables the allowlist should permit, comma separated.
# SOL_LUNA_VERIFY_ALLOW = "./gradlew,rspec"

# --- Optional worker tuning ------------------------------------------------
# LUNA_MODEL = "gpt-5.6-luna"
# LUNA_TIMEOUT_SECONDS = "1800"
# LUNA_SANDBOX = "workspace-write"
# LUNA_NETWORK_ACCESS = "0"

# --- Optional parallel orchestration ---------------------------------------
# Workers running at once in a parallel batch. Default 3, hard ceiling 8.
# SOL_LUNA_MAX_PARALLEL = "3"

# Directories linked from the workspace into each worktree. Without
# node_modules a worktree cannot run any verification command.
# SOL_LUNA_WORKTREE_LINK = "node_modules"

# When to keep a worktree after a batch: onFailure (default), always, never.
# SOL_LUNA_KEEP_WORKTREES = "onFailure"

# Allow parallel batches even when the declared task scopes contain
# uncommitted changes. Off by default: workers branch from HEAD and would not
# see that work.
# SOL_LUNA_ALLOW_DIRTY = "0"
